    <main>
        <h2>Pre-Order Enquiry Form</h2>
        <p>Looking for a specific game or an out-of-stock console? Let us know!</p>
        
        <!-- Basic HTML form for product enquiries -->
        <form action="#" method="post">
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="request">Product Requested:</label><br>
            <textarea id="request" name="request" rows="4" cols="30" required></textarea><br><br>
            
            <input type="submit" value="Submit Enquiry">
        </form>
    </main>
